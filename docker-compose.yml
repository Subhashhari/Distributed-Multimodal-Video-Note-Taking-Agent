# Video Notes Agent: full stack
#   docker compose up -d --build              # gateway + broker + postgres + redis + 2 workers
#   docker compose up -d --scale worker=4     # scale the worker pool
#   docker compose kill -s SIGKILL worker     # (or kill a single container by name) crash demo
name: video-notes

x-app: &app
  env_file: .env
  environment:
    AUTO_CREATE_SCHEMA: "false"   # the one-shot "migrate" service creates the schema
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  gateway:
    <<: *app
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: video-notes-gateway:local
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/livez"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *app
    build: { context: ., dockerfile: services/worker/Dockerfile }
    image: video-notes-worker:local
    deploy:
      replicas: 2                 # ≥ 2 independent workers
    stop_grace_period: 30s        # SIGTERM → finish current stage, then exit

  migrate:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: video-notes-gateway:local
    env_file: .env
    command: ["python", "-m", "notetaker.common.migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-notes}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-notes}
    ports:
      - "5672:5672"
      - "15672:15672"             # management UI: http://localhost:15672 (inspect queues + DLQ)
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes}
      POSTGRES_DB: ${POSTGRES_DB:-notes}
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notes} -d ${POSTGRES_DB:-notes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------- optional: monitoring
  #   docker compose --profile obs up -d     → Grafana http://localhost:3000 (dashboard "Video Notes Pipeline")
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/video-notes.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # ---------------------------------------------------------------- optional: local LLM (offline, free)
  #   docker compose --profile local-llm up -d
  #   docker compose exec ollama ollama pull <model>     then set LLM_PROVIDER=ollama, LLM_MODEL=<model>,
  #   LLM_BASE_URL=http://ollama:11434 in .env and restart the workers
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:0.5.7
    volumes: [ollama-data:/root/.ollama]
    ports: ["11434:11434"]
    restart: unless-stopped

volumes:
  rabbitmq-data: {}
  pg-data: {}
  redis-data: {}
  ollama-data: {}
